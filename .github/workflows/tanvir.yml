name: Print Txt file


on:
  workflow_dispatch:
    inputs:
      example_input:
       description: 'choose your server'
       required: true
       type: choice
       default: 'staging'

       options:
        - staging
        - production



jobs: 
    print_txt:
      runs-on: ubuntu-latest


      steps:
       - name: Checkout repo
         uses: actions/checkout@v2
       

       - name: print user inputs
         run: |
             echo "user input: ${{github.event.inputs.example_input}}"
       - name: print contents of txt file
         run : |
          cat tanvir.txt



