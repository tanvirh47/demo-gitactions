name: Print Txt file


on:
 workflow_dispatch:
 inputs:
   example_input:
      description: 'choose your server'
      required: true
      type: choice
      default: 'staging'

      options:
        - staging
        - production



jobs: 
    print_txt:
      runs-on: ubuntu-latest


      steps:
       - name: Checkout repo
